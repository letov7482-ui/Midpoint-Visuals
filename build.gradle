buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.7-SNAPSHOT"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'net.midpoint.visuals'

base {
    archivesName = 'midpoint_visuals'
}

// Обновленный блок репозиториев с точным адресом Terraformers Releases
repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://terraformersmc.com" } // Исправленная точная папка релизов
    maven { url = "https://libraries.minecraft.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings loom.officialMojangMappings()
    
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.4"
    modImplementation "com.terraformersmc:modmenu:13.0.0-beta.1"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
