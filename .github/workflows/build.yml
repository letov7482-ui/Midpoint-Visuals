name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # Скачиваем чистый дистрибутив Gradle 8.10
    - name: Download Manual Gradle 8.10
      run: |
        wget -q https://gradle.org
        sudo unzip -q gradle-8.10-bin.zip -d /opt

    # Принудительно запускаем компиляцию в обход глобальных переменных окружения GitHub
    - name: Isolated Mod Build
      run: |
        /opt/gradle-8.10/bin/gradle build --no-daemon -I /dev/null --no-build-cache

    - name: Upload Compiled Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midpoint-Visuals-Jar
        path: build/libs/*.jar
        
