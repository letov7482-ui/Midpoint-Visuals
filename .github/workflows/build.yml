name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # можно вручную запустить

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unzip project if needed (or run from root)
        run: |
          if [ -f midpoint_visuals.zip ]; then
            echo "ZIP found, extracting..."
            unzip midpoint_visuals.zip -d midpoint_visuals
            cd midpoint_visuals
          elif [ -d midpoint_visuals ]; then
            cd midpoint_visuals
          else
            echo "Project files are already in root."
          fi

          ls -la

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --warning-mode all
