name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Официально устанавливаем JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # 2. Принудительно разворачиваем чистый Gradle 8.10 через сертифицированный шаг GitHub
    - name: Setup Gradle 8.10
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'
        cache-disabled: true # Стирает ломающие старые остатки версий

    # 3. Запускаем сборку
    - name: Build Mod with Clean Environment
      run: gradle build --no-daemon

    - name: Upload Compiled Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midpoint-Visuals-Jar
        path: build/libs/*.jar
        
