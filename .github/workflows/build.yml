name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # Принудительно разворачиваем чистый Gradle 8.10
    - name: Setup Gradle 8.10
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'
        cache-disabled: true

    # Силовое создание правильного settings.gradle прямо на сервере перед сборкой
    - name: Force Apply Repositories
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                maven { url = "https://fabricmc.net" }
                gradlePluginPortal()
                mavenCentral()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                mavenCentral()
                maven { url = "https://fabricmc.net" }
                maven { url = "https://terraformersmc.com" }
            }
        }
        rootProject.name = 'midpoint_visuals'
        EOF

    # Запускаем финальную сборку мода
    - name: Build Mod with Clean Environment
      run: gradle build --no-daemon
      
