name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # Принудительно генерируем стабильный Gradle Wrapper 8.10 для Fabric
    - name: Setup Valid Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.10

    - name: Setup Gradle Permissions
      run: chmod +x gradlew

    - name: Build Mod with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload Compiled Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midpoint-Visuals-Jar
        path: build/libs/*.jar
        
