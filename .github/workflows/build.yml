name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Каталог, в который в итоге попадёт проект (с gradlew внутри).
  PROJECT_DIR: midpoint_visuals

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and unpack project archive
        run: |
          set -euo pipefail

          # Если папка с проектом уже лежит прямо в репозитории — используем её.
          if [ -f "${PROJECT_DIR}/gradlew" ]; then
            echo "Папка '${PROJECT_DIR}' с gradlew уже есть в репозитории — использую её как есть."
            exit 0
          fi

          # Иначе ищем любой .zip в корне репозитория (имя может быть любым).
          ZIP_FILE="$(find . -maxdepth 1 -iname '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::В корне репозитория не найден ни один .zip файл, и папка '${PROJECT_DIR}/gradlew' отсутствует."
            echo "Содержимое корня репозитория:"
            ls -la
            exit 1
          fi

          echo "Найден архив: ${ZIP_FILE}"
          echo "Распаковываю во временную папку _extracted ..."
          rm -rf _extracted
          mkdir -p _extracted
          unzip -o -q "${ZIP_FILE}" -d _extracted

          echo "Содержимое архива:"
          find _extracted -maxdepth 3

          # Ищем внутри распакованного архива директорию, где лежит gradlew
          # (архив может содержать проект прямо в корне, либо во вложенной папке).
          GRADLEW_PATH="$(find _extracted -maxdepth 4 -type f -name 'gradlew' -print -quit)"

          if [ -z "${GRADLEW_PATH}" ]; then
            echo "::error::В архиве '${ZIP_FILE}' не найден файл gradlew ни на одном уровне вложенности."
            exit 1
          fi

          SRC_DIR="$(dirname "${GRADLEW_PATH}")"
          echo "Проект найден в: ${SRC_DIR}"

          rm -rf "${PROJECT_DIR}"
          mv "${SRC_DIR}" "${PROJECT_DIR}"
          rm -rf _extracted

          if [ ! -f "${PROJECT_DIR}/gradlew" ]; then
            echo "::error::После перемещения '${PROJECT_DIR}/gradlew' всё ещё отсутствует."
            exit 1
          fi

          echo "Готово. Содержимое ${PROJECT_DIR}:"
          ls -la "${PROJECT_DIR}"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x "${PROJECT_DIR}/gradlew"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew build --warning-mode all --stacktrace

      - name: Show built JAR path
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          echo "Собранные JAR-файлы:"
          find build/libs -maxdepth 1 -name "*.jar" -print

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: midpoint-visuals-build
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: warn
