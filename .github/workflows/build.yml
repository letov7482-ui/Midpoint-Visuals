name: Build Mod from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip project
        run: |
          unzip midpoint_visuals_fixed_patched.zip -d project

      - name: Show files
        run: |
          ls -R project

      - name: Grant execute permission
        run: |
          chmod +x project/**/gradlew || chmod +x project/gradlew

      - name: Build
        working-directory: project
        run: |
          ./gradlew build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: project/build/libs/*.jar
