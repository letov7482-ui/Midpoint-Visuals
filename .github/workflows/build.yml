name: Build Midpoint Visuals

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ -f "midpoint-visuals.zip" ]; then
            echo "Найден midpoint-visuals.zip, распаковываю..."
            unzip -o midpoint-visuals.zip -d .
          else
            echo "midpoint-visuals.zip не найден в корне репозитория, пропускаю распаковку."
          fi

      - name: Locate build.gradle directory
        id: locate
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'build.gradle' | head -n 1)")
          echo "Проект найден в: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build with Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-visuals-jar
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
