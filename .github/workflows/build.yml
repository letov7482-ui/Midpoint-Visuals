name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Каталог проекта внутри репозитория. Если в репозитории лежит только
  # midpoint_visuals.zip, он будет распакован в эту же папку.
  PROJECT_DIR: midpoint_visuals

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Unpack project archive (if present)
        run: |
          set -euo pipefail

          if [ -f "midpoint_visuals.zip" ]; then
            echo "ZIP найден, распаковываю в '${PROJECT_DIR}'..."
            unzip -o -q midpoint_visuals.zip -d .
          elif [ -d "${PROJECT_DIR}" ]; then
            echo "ZIP не найден, но папка '${PROJECT_DIR}' уже есть в репозитории — использую её."
          else
            echo "::error::Не найден ни midpoint_visuals.zip, ни папка '${PROJECT_DIR}' в репозитории."
            exit 1
          fi

          if [ ! -d "${PROJECT_DIR}" ]; then
            echo "::error::После распаковки папка '${PROJECT_DIR}' всё ещё отсутствует."
            exit 1
          fi

          if [ ! -f "${PROJECT_DIR}/gradlew" ]; then
            echo "::error::В '${PROJECT_DIR}' отсутствует gradlew — проверьте содержимое архива."
            exit 1
          fi

          echo "Содержимое ${PROJECT_DIR}:"
          ls -la "${PROJECT_DIR}"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x "${PROJECT_DIR}/gradlew"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew build --warning-mode all --stacktrace

      - name: Show built JAR path
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          echo "Собранные JAR-файлы:"
          find build/libs -maxdepth 1 -name "*.jar" -print

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: midpoint-visuals-build
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: warn
