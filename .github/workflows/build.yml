name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать архив
        run: unzip midpoint_visuals_fixed_patched_1_21_4.zip -d project

      - name: Установить Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Проверить содержимое
        run: ls -R project

      - name: Сделать gradlew исполняемым
        run: chmod +x project/gradlew

      - name: Собрать мод
        working-directory: project
        run: ./gradlew build --stacktrace --no-daemon

      - name: Загрузить JAR
        uses: actions/upload-artifact@v4
        with:
          name: Midpoint-Visuals
          path: project/build/libs/*.jar
