name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем все файлы и папки из репозитория на сервер сборки
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Java 21, которая необходима для Minecraft 1.21.4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # 3. Автоматически создаем Gradle Wrapper, если его нет среди твоих папок
    - name: Setup Gradle
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradlew not found. Generating Wrapper..."
          gradle wrapper --gradle-version 8.11.1
        fi

    # 4. Выдаем серверу права на запуск сборщика
    - name: Setup Gradle Permissions
      run: chmod +x gradlew

    # 5. Запускаем компиляцию мода из твоих папок исходного кода
    - name: Build Mod with Gradle
      run: ./gradlew build

    # 6. Сохраняем готовый .jar файл мода на GitHub для скачивания
    - name: Upload Compiled Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midpoint-Visuals-Jar
        path: build/libs/*.jar
        
