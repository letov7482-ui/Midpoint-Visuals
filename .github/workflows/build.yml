name: Build Midpoint Visuals

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'microsoft'

    # Скачиваем дистрибутив Gradle 8.10 во временную папку сервера вручную
    - name: Download Manual Gradle 8.10
      run: |
        wget -q https://gradle.org
        sudo unzip -q gradle-8.10-bin.zip -d /opt
        echo "/opt/gradle-8.10/bin" >> $GITHUB_PATH

    # Очищаем все системные кэши старого Gradle 8.1, чтобы они не мешали компиляции
    - name: Purge Broken Caches
      run: |
        rm -rf /home/runner/.gradle/caches
        rm -rf /home/runner/.gradle/init.d/*

    # Запускаем сборку, принудительно вызывая скачанный нами чистый Gradle 8.10
    - name: Build Mod with Fixed Gradle 8.10
      run: /opt/gradle-8.10/bin/gradle build --no-daemon

    - name: Upload Compiled Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midpoint-Visuals-Jar
        path: build/libs/*.jar
        
