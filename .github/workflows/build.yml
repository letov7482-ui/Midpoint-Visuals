name: Build Midpoint

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source archive
        run: |
          unzip -o Midpoint-Visuals-modified-sources.zip -d source

      - name: Find Gradle project
        id: project
        run: |
          ROOT=$(find source -name gradlew | head -n 1 | xargs dirname)
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Project: $ROOT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x "${{ steps.project.outputs.root }}/gradlew"

      - name: Build
        working-directory: ${{ steps.project.outputs.root }}
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Midpoint
          path: ${{ steps.project.outputs.root }}/build/libs/*.jar
